name: weekly-candidates
# Every Monday, list new arXiv/OpenReview papers that are not yet in the catalog and open one issue
# with the list for a maintainer to screen (see MAINTAINING.md). Nothing is added to the list
# automatically.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "List papers first posted on or after this date (YYYY-MM-DD); default 8 days ago"
        required: false
permissions:
  contents: read
  issues: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Find candidates
        id: find
        env:
          SINCE_INPUT: ${{ github.event.inputs.since }}
        run: |
          SINCE="$SINCE_INPUT"
          if ! [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then SINCE=$(date -u -d '-8 days' +%F); fi
          python scripts/find_new.py --since "$SINCE" > candidates.md
          N=$(grep -c '^- \[ \]' candidates.md || true)
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          cat candidates.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue
        if: steps.find.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create candidates --color 0E8A16 --description "Weekly new-paper candidates" --force
          {
            echo "${{ steps.find.outputs.count }} papers posted since ${{ steps.find.outputs.since }} are not in the list yet."
            echo "Screen each abstract against CONTRIBUTING.md; add accepted papers to \`data/extra_papers.yaml\`."
            echo
            cat candidates.md
          } > body.md
          gh issue create --title "New candidates since ${{ steps.find.outputs.since }}" --label candidates --body-file body.md
