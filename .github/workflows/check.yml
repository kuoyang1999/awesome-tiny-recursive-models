name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # validates papers/results/repos, checks that data/corrections.yaml is applied, and that README.md is current
      - run: python scripts/build_readme.py --check
