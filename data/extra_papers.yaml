- id: acl-2026.acl-srw.120
  title: Learning Shortcut Models for Efficient Recursive Reasoning
  date: 2026-07
  venue: ACL 2026 Student Research Workshop
  status: W
  section: efficiency
  links:
    paper: https://aclanthology.org/2026.acl-srw.120/
  tldr: Distills recursive latent reasoning into a multiscale 'shortcut' model that predicts the effect of several
    steps at once, with a denoising repair step and stepwise-improvement supervision; competitive on ARC-AGI with
    fewer sequential updates.
  checked: 2026-11-15, AI-assisted screen of the abstract
- id: acl-2026.babylm-main.41
  title: Weight-Tied Looped Depth for Data-Constrained Pretraining
  date: 2026-10
  venue: BabyLM Workshop 2026
  status: W
  section: looped
  links:
    paper: https://aclanthology.org/2026.babylm-main.41/
  tldr: 'BabyLM Strict-Small (10M words): running a 50M-parameter block stack twice per forward pass lowers held-out
    bits-per-byte in every seed at no parameter cost but takes 1.71x the training time; looping buys parameter,
    not compute, efficiency (scaling).'
  checked: 2026-11-15, AI-assisted screen of the abstract
