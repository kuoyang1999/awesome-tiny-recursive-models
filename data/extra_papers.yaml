  short: TRLM
  date: 2026-10
  venue: BabyLM Workshop 2026
  status: W
  section: applications
  app: language
  links:
    paper: https://aclanthology.org/2026.babylm-main.29/
  tldr: 'A small masked non-autoregressive LM with input, answer and latent states: a shared Transformer repeatedly
    refines the latent state (TRM-style) before one parallel decoding pass; pretrained on about 1B tokens and evaluated
