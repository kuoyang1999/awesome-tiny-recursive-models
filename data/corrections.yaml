# Sourced corrections to entries exported from the maintainers' knowledge base.
#
# data/papers.yaml and data/results.yaml are regenerated by an export, which would undo fixes made
# directly in those files. Each fix is recorded here with its primary source and re-applied by
#     python scripts/apply_corrections.py
# after every export; `python scripts/build_readme.py --check` (CI) fails while a fix is missing.
#
# `checked` records who/what checked the source and when. Entries marked "AI-assisted source check"
# were checked by an AI assistant against the cited public record; they are not an author's manual
# verification. Dates follow the catalog rule: first public version we could document (arXiv v1,
# OpenReview public date `odate`, or the publisher), never a submission (`cdate`) or decision
# (`pdate`) date. Venue/status come from the official record only.

